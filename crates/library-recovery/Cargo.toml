[package]
license = "MPL-2.0"
name = "library-recovery"
version = "0.1.0"
edition.workspace = true

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
