[package]
license = "MPL-2.0"
name = "stl-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
allocator-api2 = { version = "=0.2.21", default-features = false, features = ["alloc"] }
hashbrown = { version = "=0.16.1", default-features = false, features = ["allocator-api2"] }
thiserror = "2"
# 3MF is an OPC zip package with an XML model part. Reading only needs an
# inflater, so the zip crate is trimmed to deflate via the pure-Rust zlib-rs
# backend (no zopfli, no encryption, no bzip2/zstd/lzma).
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41"
serde = "1"
serde_json = "1"

[dev-dependencies]
# Differential oracle only (spec §7) — never a runtime dependency of this crate.
stl_io = "0.11"
