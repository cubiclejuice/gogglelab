[package]
name = "library-runtime"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"

[dependencies]
library-backup = { path = "../library-backup" }
library-core = { path = "../library-core" }
library-integrations = { path = "../library-integrations" }
library-protocol = { path = "../library-protocol" }
library-recovery = { path = "../library-recovery" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
png = "=0.18.1"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stl-core = { path = "../stl-core" }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
time = { version = "0.3.55", features = ["formatting"] }
zeroize = "1.8"

reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
ring = "=0.17.14"
socket2 = "0.6.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rusqlite = "0.40"
