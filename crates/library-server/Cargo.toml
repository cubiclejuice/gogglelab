[package]
name = "library-server"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"

[dependencies]
library-protocol = { path = "../library-protocol" }
library-runtime = { path = "../library-runtime" }
axum = { version = "0.8.9", features = ["json", "multipart", "tokio"] }
base64 = "0.22"
getrandom = "0.4"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "set-header", "timeout"] }
uuid = { version = "1.26", features = ["v4"] }
zeroize = "1.8"
url = "2.5.8"

[dev-dependencies]
library-core = { path = "../library-core" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
