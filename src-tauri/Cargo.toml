[package]
license = "MPL-2.0"
name = "gogglelab"
version = "0.1.0"
edition.workspace = true

[features]
default = ["community"]
community = []

[[bin]]
name = "gogglelab"
path = "src/main.rs"
required-features = ["community"]

[lib]
name = "gogglelab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
plist = "1.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "=0.18.1"
base64 = "0.22"
stl-core = { path = "../crates/stl-core" }
library-recovery = { path = "../crates/library-recovery" }
library-core = { path = "../crates/library-core" }
library-backup = { path = "../crates/library-backup" }
library-integrations = { path = "../crates/library-integrations" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.41"
notify = "8.2.0"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
time = { version = "0.3.55", features = ["formatting"] }
zeroize = "1.8"

[target.'cfg(not(windows))'.dependencies]
trash = { version = "5.2.9", default-features = false }

[target.'cfg(windows)'.dependencies]
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]

[dev-dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3"
