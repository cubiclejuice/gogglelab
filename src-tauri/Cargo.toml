[package]
license = "MPL-2.0"
name = "gogglelab"
version = "0.1.0"
edition.workspace = true

[features]
default = ["community"]
community = []

[[bin]]
name = "gogglelab"
path = "src/main.rs"
required-features = ["community"]

[lib]
name = "gogglelab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
plist = "1.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stl-core = { path = "../crates/stl-core" }
library-recovery = { path = "../crates/library-recovery" }
notify = "8.2.0"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(windows))'.dependencies]
trash = { version = "5.2.9", default-features = false }

[target.'cfg(windows)'.dependencies]
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
