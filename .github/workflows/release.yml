name: Verify release sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Verify public source and release helpers
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
          key: verify-release-sources

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check public source
        run: bun run check

      - name: Test release packaging contract
        run: python -m unittest tests/test_package_release.py -v

      - name: Verify public release notices
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s THIRD-PARTY-NOTICES.md
          test -s docs/RELEASE-NOTES.md
          test -s scripts/prepare-cad-source.py
          test -s scripts/package-release.py

      - name: Confirm this workflow cannot publish binaries or releases
        run: |
          python - <<'PYTHON'
          from pathlib import Path

          workflow = Path('.github/workflows/release.yml').read_text()
          forbidden = (
              'gh release ' + 'create',
              'tauri ' + 'build',
              'build:' + 'release',
              'contents: ' + 'write',
          )
          found = [text for text in forbidden if text in workflow]
          assert not found, f'public source workflow contains publication/build command(s): {found}'
          PYTHON
